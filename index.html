<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GlowDesk | Virtual Ring Light</title>
    <meta name="description" content="Turn your screen into a professional ring light." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3Cfilter id='glow'%3E%3CfeGaussianBlur stdDeviation='4' result='coloredBlur'/%3E%3CfeMerge%3E%3CfeMergeNode in='coloredBlur'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3Crect x='10' y='10' width='80' height='80' rx='24' stroke='%233b82f6' stroke-width='8' fill='none' filter='url(%23glow)' /%3E%3Crect x='10' y='10' width='80' height='80' rx='24' stroke='white' stroke-width='3' fill='none' opacity='0.9' /%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
            },
            colors: {
              brand: {
                dark: '#050511',
                glass: 'rgba(255, 255, 255, 0.08)',
                glassBorder: 'rgba(255, 255, 255, 0.12)',
                accent: '#3b82f6',
              }
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
              'glass-gradient': 'linear-gradient(145deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%)',
              'slider-temp': 'linear-gradient(90deg, #ff9a9e 0%, #ffffff 50%, #a1c4fd 100%)',
              'slider-rainbow': 'linear-gradient(to right, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%)',
              'conic-gradient': 'conic-gradient(from 0deg, transparent 0 340deg, white 360deg)',
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.36)',
              'glow-blue': '0 0 20px rgba(59, 130, 246, 0.5)',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'blob': 'blob 7s infinite',
              'border-flow': 'borderFlow 4s linear infinite',
              'rgb-rainbow': 'hueRotate 6s linear infinite',
              'rgb-pulse': 'pulseRGB 2s ease-in-out infinite',
              'rgb-disco': 'disco 0.5s steps(1) infinite',
              'rgb-flicker': 'flicker 0.2s infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              borderFlow: {
                '0%': { backgroundPosition: '0% 50%' },
                '100%': { backgroundPosition: '100% 50%' },
              },
              hueRotate: {
                '0%': { filter: 'hue-rotate(0deg)' },
                '100%': { filter: 'hue-rotate(360deg)' },
              },
              pulseRGB: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.4' },
              },
              disco: {
                '0%': { filter: 'hue-rotate(0deg)' },
                '25%': { filter: 'hue-rotate(90deg)' },
                '50%': { filter: 'hue-rotate(180deg)' },
                '75%': { filter: 'hue-rotate(270deg)' },
              },
              flicker: {
                '0%': { opacity: '1' },
                '50%': { opacity: '0.7' },
                '100%': { opacity: '0.9' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Base Resets */
      body {
        background-color: #020205;
        /* We will handle background in the app component for more control */
        margin: 0;
        overflow-x: hidden;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.2);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.3);
      }
      
      /* Slider Logic */
      input[type=range] {
        -webkit-appearance: none; 
        background: transparent; 
        height: 24px;
        cursor: pointer;
      }
      
      /* Track */
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 6px;
        cursor: pointer;
        background: rgba(255,255,255,0.15);
        border-radius: 99px;
        border: 1px solid rgba(255,255,255,0.05);
      }
      
      /* Thumb */
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 20px;
        width: 20px;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
        margin-top: -8px; /* Centers thumb on track */
        box-shadow: 0 0 15px rgba(255,255,255,0.8);
        border: 2px solid rgba(255,255,255,1);
        transition: transform 0.1s;
      }

      input[type=range]:active::-webkit-slider-thumb {
        transform: scale(1.1);
      }

      /* Special Slider: Temperature */
      input[type=range].temp-slider::-webkit-slider-runnable-track {
        background: linear-gradient(90deg, #ff8a65 0%, #fff 50%, #64b5f6 100%);
      }

      /* Special Slider: Blue Filled */
      input[type=range].blue-slider::-webkit-slider-runnable-track {
         background: linear-gradient(90deg, #3b82f6 var(--value, 50%), rgba(255,255,255,0.1) var(--value, 50%));
      }
      
      /* Special Slider: Rainbow */
      input[type=range].rainbow-slider::-webkit-slider-runnable-track {
         background: linear-gradient(to right, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%);
      }

      /* Glass Panel Utility */
      .glass-panel {
        background: rgba(17, 25, 40, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
      }

      .perspective-container {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
    </style>
